name = "line-harness"
main = "src/index.ts"
compatibility_date = "2024-12-01"
# テスト環境のみ workers.dev サブドメインを許可（本番は env.production で無効化）
workers_dev = true

# ═══════════════════════════════════════════════════════════════
# デフォルト = テスト環境
# 使い方: npx wrangler deploy
# ═══════════════════════════════════════════════════════════════
account_id = "YOUR_DEV_ACCOUNT_ID"

[assets]
directory = "dist/client"
binding = "ASSETS"
# Worker を先に走らせて bot UA → OGP HTML 差し込みを可能にする。
# 通常 UA のときは Worker の notFound 内で c.env.ASSETS.fetch(req) を呼んで
# SPA を返す。これが無いと static asset path が Worker をバイパスして
# 直接配信され、bot 判定が効かない。
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "line-harness"
database_id = "YOUR_DEV_D1_DATABASE_ID"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "line-harness-images"

# STEELO Phase 1: preview JSON 短期キャッシュ + 生成済み xlsx / ZIP の永続保管。
# プレフィックス例:
#   preview/{previewId}.json
#   generated/{period}/{job_id}/{driver_name}.xlsx
#   generated/{period}/{job_id}/all.zip
# 配信は 15 分の短命署名付き URL でブラウザから直接 GET する。
[[r2_buckets]]
binding = "STEELO_FILES"
bucket_name = "steelo-files"

# STEELO Phase 1: 一括支払明細生成の非同期ジョブキュー。
# Queues 利用不可な環境では payment_jobs テーブル + Scheduled cron で代替する
# （README "STEELO Phase 1 セットアップ" 参照）。
[[queues.producers]]
binding = "PAYMENT_JOB_QUEUE"
queue = "payment-job-queue"

[[queues.consumers]]
queue = "payment-job-queue"
max_batch_size = 1
max_concurrency = 1

# STEELO Phase 2: LLM 解析ジョブ
# 失敗時の再配信は retry_delay 30s 起点で 3 回、それ以降は DLQ に送る
# (Codex Phase 2 review HIGH #4 反映)
[[queues.producers]]
binding = "LLM_PARSE_QUEUE"
queue = "llm-parse-queue"

[[queues.consumers]]
queue = "llm-parse-queue"
max_batch_size = 1
max_concurrency = 3
max_retries = 3
retry_delay = 30
dead_letter_queue = "llm-parse-dlq"

[[queues.producers]]
binding = "LLM_PARSE_DLQ"
queue = "llm-parse-dlq"

# STEELO Phase 2: 月次照合ジョブ
[[queues.producers]]
binding = "RECONCILIATION_QUEUE"
queue = "reconciliation-queue"

[[queues.consumers]]
queue = "reconciliation-queue"
max_batch_size = 1
max_concurrency = 1
max_retries = 2
retry_delay = 60
dead_letter_queue = "reconciliation-dlq"

[[queues.producers]]
binding = "RECONCILIATION_DLQ"
queue = "reconciliation-dlq"

# STEELO Phase 3: PDF レポート生成ジョブ
[[queues.producers]]
binding = "REPORT_QUEUE"
queue = "report-queue"

[[queues.consumers]]
queue = "report-queue"
max_batch_size = 1
max_concurrency = 1
max_retries = 2
retry_delay = 60
dead_letter_queue = "report-dlq"

[[queues.producers]]
binding = "REPORT_DLQ"
queue = "report-dlq"

[triggers]
# Phase 1+2 既存: */5 (payment/reconciliation/LLM fallback + recovery)
# Phase 1 既存: 0 */6 (import_batch_previews TTL クリーンアップ)
# Phase 3 新規: */1 (slack-dispatcher)
# Phase 3 新規: 0 0 1 * * = JST 9:00 月初 (baseline recompute + monthly_reminder)
crons = ["*/5 * * * *", "0 */6 * * *", "*/1 * * * *", "0 0 1 * *"]

# ═══════════════════════════════════════════════════════════════
# 本番環境
# 使い方: npx wrangler deploy --env production --name your-worker-name
# D1:     npx wrangler d1 execute your-database --env production --remote --file ...
# ═══════════════════════════════════════════════════════════════
[env.production]
account_id = "YOUR_ACCOUNT_ID"
# 本番では workers.dev サブドメイン経由のアクセスを禁止し、
# Cloudflare Access を被せた独自ホストでのみ到達可能にする
workers_dev = false

[env.production.assets]
directory = "dist/client"
binding = "ASSETS"
run_worker_first = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "line-crm"
database_id = "YOUR_D1_DATABASE_ID"

[[env.production.r2_buckets]]
binding = "IMAGES"
bucket_name = "line-harness-images"

[[env.production.r2_buckets]]
binding = "STEELO_FILES"
bucket_name = "steelo-files"

[[env.production.queues.producers]]
binding = "PAYMENT_JOB_QUEUE"
queue = "payment-job-queue"

[[env.production.queues.consumers]]
queue = "payment-job-queue"
max_batch_size = 1
max_concurrency = 1

[[env.production.queues.producers]]
binding = "LLM_PARSE_QUEUE"
queue = "llm-parse-queue"

[[env.production.queues.consumers]]
queue = "llm-parse-queue"
max_batch_size = 1
max_concurrency = 3
max_retries = 3
retry_delay = 30
dead_letter_queue = "llm-parse-dlq"

[[env.production.queues.producers]]
binding = "LLM_PARSE_DLQ"
queue = "llm-parse-dlq"

[[env.production.queues.producers]]
binding = "RECONCILIATION_QUEUE"
queue = "reconciliation-queue"

[[env.production.queues.consumers]]
queue = "reconciliation-queue"
max_batch_size = 1
max_concurrency = 1
max_retries = 2
retry_delay = 60
dead_letter_queue = "reconciliation-dlq"

[[env.production.queues.producers]]
binding = "RECONCILIATION_DLQ"
queue = "reconciliation-dlq"

# STEELO Phase 3: PDF レポート生成ジョブ
[[env.production.queues.producers]]
binding = "REPORT_QUEUE"
queue = "report-queue"

[[env.production.queues.consumers]]
queue = "report-queue"
max_batch_size = 1
max_concurrency = 1
max_retries = 2
retry_delay = 60
dead_letter_queue = "report-dlq"

[[env.production.queues.producers]]
binding = "REPORT_DLQ"
queue = "report-dlq"

[env.production.triggers]
crons = ["*/5 * * * *", "0 */6 * * *", "*/1 * * * *", "0 0 1 * *"]
